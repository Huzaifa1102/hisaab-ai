[theme]
primaryColor = "#059669"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[client]
# Never show raw tracebacks in the browser; full details still print in the terminal
showErrorDetails = false
# Hide developer controls (Deploy, Rerun, Clear cache) during the demo
toolbarMode = "viewer"
