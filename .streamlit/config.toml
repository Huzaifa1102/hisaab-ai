[theme]
# Ink blue for actions, cool paper background (see the khata identity notes in app.py)
primaryColor = "#1E3A8A"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[client]
# Never show raw tracebacks in the browser; full details still print in the terminal
showErrorDetails = false
# Hide developer controls (Deploy, Rerun, Clear cache) during the demo
toolbarMode = "viewer"
